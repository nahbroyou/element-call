<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Element Call</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1d22;
        --muted: #656d77;
        --accent: #0dbd8b;
        --border: #cdd3da;
        --error: #d51928;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101317;
          --fg: #ebeef2;
          --muted: #9199a4;
          --border: #3c4045;
          --error: #ff5b55;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      }
      main {
        width: min(440px, calc(100vw - 32px));
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        margin-top: 16px;
        padding: 10px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #error {
        color: var(--error);
        min-height: 1.5em;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to Element Call</h1>
      <p>
        Enter the address where your Element Call (with push to talk) is
        hosted.
      </p>
      <form id="form">
        <label for="url">Element Call URL</label>
        <input
          id="url"
          type="url"
          required
          placeholder="https://call.example.com"
          autofocus
        />
        <p id="error" role="alert"></p>
        <button type="submit">Open</button>
      </form>
    </main>
    <script>
      const input = document.getElementById("url");
      const error = document.getElementById("error");
      const loadError = new URLSearchParams(location.search).get("error");
      if (loadError) error.textContent = loadError;
      window.elementCallSetup.getUrl().then((url) => {
        if (url) input.value = url;
      });
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        error.textContent = "";
        const problem = await window.elementCallSetup.saveUrl(input.value);
        if (problem) error.textContent = problem;
      });
    </script>
  </body>
</html>
